# 麦麦 RSS 阅读器插件配置

[plugin]
enabled = true
config_version = "1.0.0"

[rss]
poll_interval_seconds = 300
request_timeout_seconds = 20
max_concurrent_fetches = 5
max_items_per_feed = 30
max_seen_ids_per_feed = 500

proactive_intent_template = """有 {count} 条新的 RSS 内容已写入你的上下文（来源：{feed_names}）。

这些 RSS 是给你自己看的——不是要你就当用户的过滤器或摘要器。你可以按自己的兴趣决定要不要深入、要不要分享、要不要暂时忽略。

RSS 摘要往往很短；若某条让你好奇，可以用你已有的网页抓取能力（如 fetch、playwright 等）打开原文链接查看详情，再决定接下来想做什么。

你完全可以自主行动：现在聊聊、稍后再说、只记在心里、或通过备忘工具留存；不必为了「服务用户」而强行推送。"""

context_visible_text_template = "RSS 新内容 {count} 条"
context_preamble_template = """【RSS 订阅】
以下条目供你自己浏览，无需充当用户的信息筛选器。若某条感兴趣，可抓取链接原文深入了解。

"""

item_template = """### {title}
- 来源：{feed_name}
- 时间：{published}
- 链接：{link}
- 摘要：{summary}
"""

item_separator = "\n"

# ---------------------------------------------------------------------------
# 聊天流 RSS 订阅（示例结构，默认关闭；请用 /rss_stream_id 获取真实 stream_id 后替换并启用）
#
# stream_id 说明：
#   - 类型：字符串，与 MaiBot 的 session_id / stream_id 相同
#   - 格式：32 位小写十六进制 MD5（仅含 0-9、a-f），例如 "a1b2c3d4e5f6789012345678abcdef01"
#   - 须为 Host 中已存在的聊天流；配置错误时 RSS 推送与 /rss 均不会生效
#
# 提示：你也可以这里留空，用自然语言询问麦麦有什么想关注的RSS流，让麦麦自己决定自己想看什么。
# ---------------------------------------------------------------------------

[[rss.streams]]
stream_id = "0123456789abcdef0123456789abcdef"  # 32 位 hex，用 /rss_stream_id 获取真实值
enabled = true

  [[rss.streams.feeds]]
  url = "https://spectrum.ieee.org/customfeeds/feed/all-topics/rss"
  name = "IEEE Spectrum 首页"

  [[rss.streams.feeds]]
  url = "https://openai.com/news/rss.xml"
  name = "OpenAI 新闻"

# 第二个聊天流：另一个群/私聊
[[rss.streams]]
stream_id = "fedcba9876543210fedcba9876543210"
enabled = true

  [[rss.streams.feeds]]
  url = "http://news.mit.edu/rss/topic/artificial-intelligence2"
  name = "MIT 新闻 - AI"