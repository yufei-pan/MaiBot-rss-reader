# 麦麦 RSS 阅读器插件配置
#
# [rss] 下的数值与模板字段留空（或不写）即使用插件代码中的内置默认；
# 仅在你需要覆盖默认值时再填写。插件升级后修改内置默认时，留空字段会自动跟随新默认。

[plugin]
enabled = true
config_version = "1.2.0"

[rss]
# poll_interval_seconds =          # 留空=内置默认 300
# request_timeout_seconds =        # 留空=内置默认 20
# max_concurrent_fetches =         # 留空=内置默认 5
# max_items_per_feed =             # 留空=内置默认 30
# max_seen_ids_per_feed =          # 留空=内置默认 500
#
# proactive_intent_template = """..."""       # 留空=内置默认模板
# context_visible_text_template = "..."       # 留空=内置默认模板
# context_preamble_template = """..."""       # 留空=内置默认模板
# item_template = """..."""                   # 留空=内置默认模板
# item_separator = "\n"                       # 留空=内置默认换行

# ---------------------------------------------------------------------------
# 聊天流 RSS 订阅（扁平结构，便于 WebUI 编辑）
#
# 1. 在 rss.streams 中声明聊天流并设置 enabled
# 2. 在 rss.feeds 中为每个 RSS 源填写 stream_id（关联上方聊天流）、url、name
#
# stream_id 说明：
#   - 类型：字符串，与 MaiBot 的 session_id / stream_id 相同
#   - 格式：32 位小写十六进制 MD5（仅含 0-9、a-f），例如 "a1b2c3d4e5f6789012345678abcdef01"
#   - 须为 Host 中已存在的聊天流；配置错误时 RSS 推送与 /rss 均不会生效
#
# 提示：你也可以这里留空，用自然语言询问麦麦有什么想关注的RSS流，让麦麦自己决定自己想看什么。
# ---------------------------------------------------------------------------

[[rss.streams]]
stream_id = "0123456789abcdef0123456789abcdef"  # 32 位 hex，用 /rss_stream_id 获取真实值
enabled = true

[[rss.streams]]
stream_id = "fedcba9876543210fedcba9876543210"
enabled = true

[[rss.feeds]]
stream_id = "0123456789abcdef0123456789abcdef"
url = "https://spectrum.ieee.org/customfeeds/feed/all-topics/rss"
name = "IEEE Spectrum 首页"

[[rss.feeds]]
stream_id = "0123456789abcdef0123456789abcdef"
url = "https://openai.com/news/rss.xml"
name = "OpenAI 新闻"

[[rss.feeds]]
stream_id = "fedcba9876543210fedcba9876543210"
url = "http://news.mit.edu/rss/topic/artificial-intelligence2"
name = "MIT 新闻 - AI"
